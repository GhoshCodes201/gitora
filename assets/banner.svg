<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Gitora — Your Code. Your Aura." font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="0.55" stop-color="#11151a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#a78bfa;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.5;0.18;0.5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.12;0.4" dur="5s" repeatCount="indefinite" begin="1s"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="typeclip">
      <rect x="126" y="196" width="0" height="64">
        <animate attributeName="width" from="0" to="640" dur="2.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- glow blobs -->
  <circle cx="150" cy="60" r="230" fill="url(#glowPurple)" filter="url(#blur)"/>
  <circle cx="1080" cy="280" r="240" fill="url(#glowCyan)" filter="url(#blur)"/>

  <!-- faint grid of pulsing dots -->
  <g opacity="0.5">
    <g fill="#8b949e">
      <circle cx="40" cy="40" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="60" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" begin="0.6s"/></circle>
      <circle cx="560" cy="30" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" begin="1.2s"/></circle>
      <circle cx="830" cy="70" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite" begin="0.3s"/></circle>
      <circle cx="1120" cy="40" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite" begin="0.9s"/></circle>
      <circle cx="170" cy="270" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite" begin="0.4s"/></circle>
      <circle cx="420" cy="290" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite" begin="1.5s"/></circle>
      <circle cx="720" cy="260" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" repeatCount="indefinite" begin="0.7s"/></circle>
    </g>
  </g>

  <!-- wordmark -->
  <g>
    <text x="120" y="168" font-size="104" font-weight="800" letter-spacing="1" fill="url(#wordGrad)">Gitora</text>
    <text x="120" y="168" font-size="104" font-weight="800" letter-spacing="1" fill="#8b5cf6" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="dy" values="0;-4;0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
    </text>
  </g>

  <!-- typing tagline -->
  <text x="126" y="252" font-size="34" font-weight="600" fill="#a78bfa" clip-path="url(#typeclip)">Your Code. Your Aura.</text>
  <g>
    <line x1="600" y1="196" x2="600" y2="252" stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" begin="1.1s"/>
    </line>
  </g>

  <!-- score gauge -->
  <g transform="translate(985,150)">
    <!-- rotating dashed ring -->
    <circle r="128" fill="none" stroke="#21262d" stroke-width="3" stroke-dasharray="12 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- track -->
    <path d="M -112 0 A 112 112 0 0 1 112 0" fill="none" stroke="#21262d" stroke-width="16" stroke-linecap="round"/>
    <!-- animated progress arc -->
    <path d="M -112 0 A 112 112 0 0 1 112 0" fill="none" stroke="url(#wordGrad)" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="352" stroke-dashoffset="352">
      <animate attributeName="stroke-dashoffset" from="352" to="88" dur="2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>

    <!-- needle -->
    <g>
      <g>
        <line x1="0" y1="6" x2="96" y2="6" stroke="#e6edf3" stroke-width="5" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="-96;-60;-96" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" begin="1.5s"/>
        </line>
      </g>
      <circle r="10" fill="#22d3ee"/>
      <circle r="4" fill="#0b0d10"/>
    </g>

    <!-- score -->
    <text y="58" font-size="46" font-weight="800" fill="#e6edf3" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.8s" fill="freeze"/>
      <tspan fill="#a78bfa">7</tspan><tspan fill="#22d3ee">6</tspan>
    </text>
    <text y="80" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2s" fill="freeze"/>
      GITORA SCORE
    </text>
  </g>

  <!-- orbiting particle -->
  <g opacity="0.7">
    <circle r="4" fill="#22d3ee">
      <animateTransform attributeName="transform" type="translate" values="985,150;865,190;985,290;1105,190;985,150" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
