<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Gitora Score — five weighted pillars" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#a78bfa;#8b5cf6" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.12;0.35" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clipA"><rect x="460" y="112" width="580" height="26" rx="13"/></clipPath>
    <clipPath id="clipB"><rect x="460" y="167" width="580" height="26" rx="13"/></clipPath>
    <clipPath id="clipC"><rect x="460" y="222" width="580" height="26" rx="13"/></clipPath>
    <clipPath id="clipD"><rect x="460" y="277" width="580" height="26" rx="13"/></clipPath>
    <clipPath id="clipE"><rect x="460" y="332" width="580" height="26" rx="13"/></clipPath>
  </defs>

  <rect width="1200" height="460" fill="url(#bgGrad)"/>
  <circle cx="150" cy="430" r="200" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1080" cy="40" r="200" fill="url(#glow)" filter="url(#blur)"/>

  <text x="600" y="64" font-size="40" font-weight="800" fill="#e6edf3" text-anchor="middle">How the score works</text>
  <text x="600" y="98" font-size="19" fill="#8b949e" text-anchor="middle">Five weighted pillars feed into your Gitora Score</text>

  <!-- row template: label (x150, y=barCenter) / track x460 w580 / weight chip x1080 -->

  <!-- Activity × 0.20 -->
  <text x="150" y="130" font-size="24" font-weight="600" fill="#e6edf3">Activity</text>
  <text x="150" y="156" font-size="14" fill="#8b949e">commits · repos · stars · issues</text>
  <rect x="460" y="112" width="580" height="26" rx="13" fill="#11151a" stroke="#21262d"/>
  <g clip-path="url(#clipA)">
    <rect x="460" y="112" width="0" height="26" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="464" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
  <text x="1080" y="130" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" text-anchor="end" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    × 0.20
  </text>

  <!-- Consistency × 0.25 -->
  <text x="150" y="185" font-size="24" font-weight="600" fill="#e6edf3">Consistency</text>
  <text x="150" y="211" font-size="14" fill="#8b949e">active weeks · streaks · rhythm</text>
  <rect x="460" y="167" width="580" height="26" rx="13" fill="#11151a" stroke="#21262d"/>
  <g clip-path="url(#clipB)">
    <rect x="460" y="167" width="0" height="26" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="580" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
  <text x="1080" y="185" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" text-anchor="end" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    × 0.25
  </text>

  <!-- Collaboration × 0.20 -->
  <text x="150" y="240" font-size="24" font-weight="600" fill="#e6edf3">Collaboration</text>
  <text x="150" y="266" font-size="14" fill="#8b949e">issues · forks · community</text>
  <rect x="460" y="222" width="580" height="26" rx="13" fill="#11151a" stroke="#21262d"/>
  <g clip-path="url(#clipC)">
    <rect x="460" y="222" width="0" height="26" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="464" dur="1.1s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
  <text x="1080" y="240" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" text-anchor="end" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
    × 0.20
  </text>

  <!-- Project Quality × 0.20 -->
  <text x="150" y="295" font-size="24" font-weight="600" fill="#e6edf3">Project Quality</text>
  <text x="150" y="321" font-size="14" fill="#8b949e">docs · license · recency · interest</text>
  <rect x="460" y="277" width="580" height="26" rx="13" fill="#11151a" stroke="#21262d"/>
  <g clip-path="url(#clipD)">
    <rect x="460" y="277" width="0" height="26" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="464" dur="1.1s" begin="1.7s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
  <text x="1080" y="295" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" text-anchor="end" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    × 0.20
  </text>

  <!-- Open Source × 0.15 -->
  <text x="150" y="350" font-size="24" font-weight="600" fill="#e6edf3">Open Source</text>
  <text x="150" y="376" font-size="14" fill="#8b949e">public repos · external contributions</text>
  <rect x="460" y="332" width="580" height="26" rx="13" fill="#11151a" stroke="#21262d"/>
  <g clip-path="url(#clipE)">
    <rect x="460" y="332" width="0" height="26" fill="url(#barGrad)">
      <animate attributeName="width" from="0" to="348" dur="1.1s" begin="2.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>
  <text x="1080" y="350" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" text-anchor="end" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    × 0.15
  </text>
</svg>
